# KKISI web only. Its own compose project, containers, network and loopback port: it does not reference, reuse or
# restart any other application on the shared GCP VM, and installs nothing on the host.
#   KKISI_WEB_TAG=<tag> KKISI_TUNNEL_TAG=<tag> docker compose -f deploy/gcp/docker-compose.yml up -d
# Secrets live on the server only (never in Git or images):
#   ${KKISI_WEB_ENV_FILE}             app environment (mode 600)
#   ${KKISI_TUNNEL_DIR}/id_ed25519    tunnel private key (mode 600), restricted on the server side to port-forwarding
#   ${KKISI_TUNNEL_DIR}/known_hosts   pinned host key of the SSH server (StrictHostKeyChecking=yes)
#
# Network layout ("pod" pattern): `netns` owns one private network namespace and never restarts on its own; the
# tunnel and the app join it. The tunnel listens on 127.0.0.1:${TUNNEL_LOCAL_PORT} INSIDE that namespace only: it is
# not published on the host or on any Docker network. Either member can restart without breaking the other.
name: kkisi-web

services:
  netns:
    image: registry.k8s.io/pause:3.10
    container_name: kkisi-web-netns
    # The app's only published port: loopback on the host; the host nginx proxies to it. Never 0.0.0.0.
    ports:
      - "127.0.0.1:${KKISI_WEB_HOST_PORT:-3140}:3000"
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 16m
    networks:
      - kkisi-web

  db-tunnel:
    image: kkisi-db-tunnel:${KKISI_TUNNEL_TAG:?set KKISI_TUNNEL_TAG to the tunnel image tag}
    build:
      context: tunnel
    container_name: kkisi-db-tunnel
    network_mode: "service:netns"
    environment:
      TUNNEL_SSH_HOST: ${TUNNEL_SSH_HOST:?set TUNNEL_SSH_HOST}
      TUNNEL_SSH_PORT: ${TUNNEL_SSH_PORT:?set TUNNEL_SSH_PORT}
      TUNNEL_SSH_USER: ${TUNNEL_SSH_USER:?set TUNNEL_SSH_USER}
      TUNNEL_LOCAL_PORT: ${TUNNEL_LOCAL_PORT:-3307}
      TUNNEL_REMOTE_PORT: ${TUNNEL_REMOTE_PORT:-3306}
    volumes:
      - ${KKISI_TUNNEL_DIR:-/opt/kkisi-web/tunnel}/id_ed25519:/run/tunnel/id_ed25519:ro
      - ${KKISI_TUNNEL_DIR:-/opt/kkisi-web/tunnel}/known_hosts:/run/tunnel/known_hosts:ro
    # ssh exits on any failure (ExitOnForwardFailure, 3 missed keepalives = ~45 s); Docker restarts it with backoff.
    restart: always
    init: true
    read_only: true
    tmpfs:
      - /home/tunnel:uid=10001,gid=10001,mode=0700
    security_opt:
      - no-new-privileges:true
    # CHOWN/DAC_OVERRIDE/SETUID/SETGID: entrypoint copies the key with ssh's required ownership, then su-exec drops to
    # the "tunnel" user. KILL: lets init (root) forward stop signals to that user's ssh process.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
      - KILL
    mem_limit: 64m
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 ${TUNNEL_LOCAL_PORT:-3307}"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  web:
    image: kkisi-web:${KKISI_WEB_TAG:?set KKISI_WEB_TAG to the image tag to run}
    container_name: kkisi-web
    network_mode: "service:netns"
    env_file:
      - ${KKISI_WEB_ENV_FILE:-/opt/kkisi-web/.env.production}
    depends_on:
      db-tunnel:
        condition: service_healthy
    # Exactly one Next.js process in one container: the connection budget (LEGACY_DB_CONNECTION_BUDGET) assumes it.
    # Do not add replicas/scale without recomputing the budget against max_user_connections.
    # If the tunnel is down at boot, the startup check fails and Docker restarts the app until the tunnel is back.
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache:uid=1000,gid=1000
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Bounded so this app cannot starve the other workloads on the shared VM.
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  kkisi-web:
    name: kkisi-web
