function Icon(name, { size = 20, color = 'currentColor', strokeWidth = 1.8 } = {}) {
  const d = ICON_PATHS[name] || ICON_PATHS.grid;
  const paths = d.split('|');
  return React.createElement('svg', { width: size, height: size, viewBox: '0 0 24 24', fill: 'none' },
    paths.map((p, i) => React.createElement('path', { key: i, d: p, stroke: color, strokeWidth, strokeLinecap: 'round', strokeLinejoin: 'round' }))
  );
}

function ImgSlot(id, opts = {}) {
  return React.createElement('image-slot', { id, placeholder: opts.placeholder || 'Drop gambar', shape: opts.shape || 'rect', style: { width: '100%', height: '100%', display: 'block', ...(opts.style || {}) } });
}

function Btn(label, onClick, opts={}) {
  const base = { padding:'14px', borderRadius:12, border:'none', fontSize:14, fontWeight:600, cursor:'pointer', textAlign:'center', width:'100%' };
  const variant = opts.variant === 'secondary'
    ? { background:'#fff', color:BLUE, border:`1px solid ${BLUE}` }
    : opts.variant === 'destructive'
    ? { background: ERROR, color:'#fff' }
    : { background:BLUE, color:'#fff' };
  return React.createElement('button', { onClick, style:{...base, ...variant, ...(opts.style||{})} }, label);
}

            ]),
        R('div', { key:'limit', style:{ background:'#fff', border:`1px solid ${N100}`, borderRadius:14, padding:14, fontSize:12.5, color:N700 } }, [
          R('div', { key:'a', style:{fontWeight:700, marginBottom:4} }, 'Limit Payroll Deduction'),
          R('div', { key:'b' }, 'Rp 750.000 tersisa dari Rp 1.500.000 bulan ini'),
        ]),
        R('div', { key:'hh', style:{ display:'flex', justifyContent:'space-between', alignItems:'center' } }, [
          R('span', { key:'t', style:{ fontSize:14, fontWeight:700, color:N900 } }, 'Transaksi Terakhir'),
          R('button', { key:'more', onClick:()=>this.go('history'), style:{ background:'none', border:'none', color:BLUE, fontSize:12.5, fontWeight:700, cursor:'pointer' } }, 'Lihat Semua'),
        ]),
        R('div', { key:'list', style:{ display:'flex', flexDirection:'column', gap:8 } }, walletTx.map(h =>
          R('div', { key:h.id, style:{ display:'flex', justifyContent:'space-between', alignItems:'center', background:'#fff', border:`1px solid ${N100}`, borderRadius:12, padding:12 } }, [
            R('div', { key:'l' }, [
              R('div', { key:'a', style:{ fontSize:13, fontWeight:600, color:N900 } }, h.title),
              R('div', { key:'b', style:{ fontSize:11, color:N500, marginTop:2 } }, h.date),
            ]),
            R('span', { key:'amt', style:{ fontSize:13, fontWeight:700, color: h.amount>0?SUCCESS:ERROR } }, (h.amount>0?'+':'') + rp(h.amount)),
          ])
        )),
      ])));
    }

    // ---------- SIMPAN PINJAM ----------
    if (s.screen === 'simpanpinjam') {
      if (s.pinjamanStage === 'success') {
        return R(IOSDevice, { width:402, height:874 }, page([
          R('div', { key:'c', style:{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:14, padding:24 } }, [
            R('div', { key:'circle', style:{ width:72, height:72, borderRadius:'50%', background:SUCCESS_SOFT, display:'flex', alignItems:'center', justifyContent:'center', fontSize:34, color:SUCCESS } }, '✓'),
            R('div', { key:'t', style:{ fontSize:18, fontWeight:700, color:N900 } }, 'Pengajuan Pinjaman Terkirim'),
            R('div', { key:'d', style:{ fontSize:13, color:N500, textAlign:'center' } }, `${rp(s.pinjamanNominal)} · Tenor ${s.pinjamanTenor} bulan`),
            R('div', { key:'note', style:{ fontSize:11.5, color:N300, textAlign:'center' } }, 'Menunggu persetujuan Admin Koperasi & Supervisor'),
            R('div', { key:'btn', style:{width:'70%',marginTop:10} }, Btn('Kembali', ()=>this.setState({screen:'simpanpinjam', pinjamanStage:'overview', simpanPinjamTab:'pinjaman'}))),
          ]),
        ]));
      }
      if (s.pinjamanStage === 'form') {
        const nominalOpts = [1000000,2500000,5000000,10000000];
        const tenorOpts = [3,6,12,24];
        return R(IOSDevice, { width:402, height:874 }, page([
          R('div', { key:'nav', style:{ display:'flex', alignItems:'center', gap:12, padding:'14px 16px' } }, [
            R('button', { key:'back', onClick:()=>this.setState({pinjamanStage:'overview'}), style:{ background:N50, border:'none', width:36, height:36, borderRadius:10, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center' } }, Icon('chevronLeft', { size:18, color:N700 })),
            R('div', { key:'t', style:{ fontSize:15, fontWeight:700, color:N900 } }, 'Ajukan Pinjaman'),
          ]),
          R('div', { key:'body', style:{ flex:1, padding:16, display:'flex', flexDirection:'column', gap:16, overflowY:'auto' } }, [
            R('div', { key:'nom' }, [
              R('div', { key:'l', style:{ fontSize:12, fontWeight:600, color:N700, marginBottom:8 } }, 'Nominal Pinjaman'),
              R('div', { key:'g', style:{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:8 } }, nominalOpts.map(n =>
                R('button', { key:n, onClick:()=>this.setState({pinjamanNominal:n}), style:{ padding:'12px', borderRadius:12, border:`1px solid ${s.pinjamanNominal===n?BLUE:N200}`, background:s.pinjamanNominal===n?BLUE_SOFT:'#fff', color:s.pinjamanNominal===n?BLUE:N900, fontWeight:700, fontSize:13, cursor:'pointer' } }, rp(n))
              )),
            ]),
            R('div', { key:'ten' }, [
              R('div', { key:'l', style:{ fontSize:12, fontWeight:600, color:N700, marginBottom:8 } }, 'Tenor (bulan)'),
              R('div', { key:'g', style:{ display:'flex', gap:8 } }, tenorOpts.map(t =>
                R('button', { key:t, onClick:()=>this.setState({pinjamanTenor:t}), style:{ flex:1, padding:'10px', borderRadius:10, border:`1px solid ${s.pinjamanTenor===t?BLUE:N200}`, background:s.pinjamanTenor===t?BLUE_SOFT:'#fff', color:s.pinjamanTenor===t?BLUE:N900, fontWeight:700, fontSize:13, cursor:'pointer' } }, t)
              )),
            ]),
            R('div', { key:'tuj', style:{ display:'flex', flexDirection:'column', gap:6 } }, [
              R('label', { key:'l', style:{ fontSize:12, fontWeight:600, color:N700 } }, 'Tujuan Pinjaman'),
              R('input', { key:'i', value:s.pinjamanTujuan, onChange:e=>this.setState({pinjamanTujuan:e.target.value}), placeholder:'Contoh: Kebutuhan pendidikan anak', style:{ height:48, borderRadius:12, border:`1px solid ${N200}`, padding:'0 14px', fontSize:14, fontFamily:'Inter,sans-serif' } }),
            ]),
            R('div', { key:'est', style:{ background:BLUE_SOFT, border:`1px solid #C7D9FF`, borderRadius:12, padding:12, fontSize:12.5, color:BLUE } }, `Estimasi angsuran ±${rp(Math.round(s.pinjamanNominal/s.pinjamanTenor))} /bulan`),
          ]),
          R('div', { key:'cta', style:{ padding:16, borderTop:`1px solid ${N100}` } }, Btn('Kirim Pengajuan', ()=>this.setState({pinjamanStage:'success'}))),
        ]));
      }
      return R(IOSDevice, { width:402, height:874 }, page([
        R('div', { key:'nav', style:{ display:'flex', alignItems:'center', gap:12, padding:'14px 16px' } }, [
          R('button', { key:'back', onClick:()=>this.go('home'), style:{ background:N50, border:'none', width:36, height:36, borderRadius:10, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center' } }, Icon('chevronLeft', { size:18, color:N700 })),
          R('div', { key:'t', style:{ fontSize:15, fontWeight:700, color:N900 } }, 'Simpan Pinjam'),
        ]),
        R('div', { key:'tabs', style:{ display:'flex', gap:6, background:N100, borderRadius:12, padding:4, margin:'0 16px 4px' } }, ['simpanan','pinjaman'].map(t =>
          R('button', { key:t, onClick:()=>this.setState({simpanPinjamTab:t}), style:{ flex:1, padding:'8px', borderRadius:9, border:'none', background:s.simpanPinjamTab===t?'#fff':'transparent', fontWeight:700, fontSize:12.5, color:s.simpanPinjamTab===t?BLUE:N500, cursor:'pointer' } }, t==='simpanan'?'Simpanan':'Pinjaman')
        )),
        R('div', { key:'body', style:{ flex:1, padding:16, display:'flex', flexDirection:'column', gap:14, overflowY:'auto' } },
          s.simpanPinjamTab === 'simpanan' ? [
            R('div', { key:'total', style:{ background:BLUE, borderRadius:16, padding:18, color:'#fff', display:'flex', flexDirection:'column', gap:6 } }, [
              R('div', { key:'l', style:{ fontSize:12.5, color:'rgba(255,255,255,0.75)' } }, 'Total Simpanan'),
              R('div', { key:'v', style:{ fontSize:26, fontWeight:700 } }, rp(SIMPANAN.pokok + SIMPANAN.wajib + SIMPANAN.sukarela)),
            ]),
            R('div', { key:'breakdown', style:{ display:'flex', flexDirection:'column', gap:8 } }, [
              ['Simpanan Pokok', SIMPANAN.pokok], ['Simpanan Wajib', SIMPANAN.wajib], ['Simpanan Sukarela', SIMPANAN.sukarela],
            ].map(([label,val]) => R('div', { key:label, style:{ display:'flex', justifyContent:'space-between', alignItems:'center', background:'#fff', border:`1px solid ${N100}`, borderRadius:12, padding:'12px 14px' } }, [
              R('span', { key:'l', style:{ fontSize:13, fontWeight:600, color:N900 } }, label),
              R('span', { key:'v', style:{ fontSize:13, fontWeight:700, color:N700 } }, rp(val)),
            ]))),
            R('div', { key:'btn' }, Btn('Ajukan Setoran Sukarela', ()=>{})),
            R('div', { key:'hh', style:{ fontSize:14, fontWeight:700, color:N900, marginTop:4 } }, 'Riwayat Setoran'),
            R('div', { key:'list', style:{ display:'flex', flexDirection:'column', gap:8 } }, RIWAYAT_SIMPANAN.map((h,i) =>
              R('div', { key:i, style:{ display:'flex', justifyContent:'space-between', alignItems:'center', background:'#fff', border:`1px solid ${N100}`, borderRadius:12, padding:12 } }, [
                R('div', { key:'l' }, [
                  R('div', { key:'a', style:{ fontSize:13, fontWeight:600, color:N900 } }, h.title),
                  R('div', { key:'b', style:{ fontSize:11, color:N500, marginTop:2 } }, h.date),
                ]),
                R('span', { key:'amt', style:{ fontSize:13, fontWeight:700, color:SUCCESS } }, '+' + rp(h.amount)),
              ])
            )),
          ] : [
            R('div', { key:'card', style:{ background:N900, borderRadius:16, padding:18, color:'#fff', display:'flex', flexDirection:'column', gap:10 } }, [
              R('div', { key:'l', style:{ fontSize:12.5, color:'rgba(255,255,255,0.6)' } }, 'Sisa Pinjaman Aktif'),
              R('div', { key:'v', style:{ fontSize:26, fontWeight:700 } }, rp(PINJAMAN_AKTIF.sisaPokok)),
              R('div', { key:'row', style:{ display:'flex', justifyContent:'space-between', fontSize:11.5, color:'rgba(255,255,255,0.7)', marginTop:4 } }, [
                R('span', { key:'a' }, `Angsuran ${rp(PINJAMAN_AKTIF.angsuranPerBulan)}/bulan`),
                R('span', { key:'b' }, `${PINJAMAN_AKTIF.sisaTenor}/${PINJAMAN_AKTIF.tenorBulan} bulan tersisa`),
              ]),
            ]),
            R('div', { key:'due', style:{ background:WARNING_SOFT, border:`1px solid #FDE9BC`, borderRadius:12, padding:12, fontSize:12.5, color:'#92400E' } }, `Jatuh tempo angsuran berikutnya: ${PINJAMAN_AKTIF.jatuhTempo}`),
            R('div', { key:'btn' }, Btn('Ajukan Pinjaman Baru', ()=>this.setState({pinjamanStage:'form'}))),
            R('div', { key:'hh', style:{ fontSize:14, fontWeight:700, color:N900, marginTop:4 } }, 'Riwayat Angsuran'),
            R('div', { key:'list', style:{ display:'flex', flexDirection:'column', gap:8 } }, RIWAYAT_ANGSURAN.map((h,i) =>
              R('div', { key:i, style:{ display:'flex', justifyContent:'space-between', alignItems:'center', background:'#fff', border:`1px solid ${N100}`, borderRadius:12, padding:12 } }, [
                R('div', { key:'l' }, [
                  R('div', { key:'a', style:{ fontSize:13, fontWeight:600, color:N900 } }, h.title),
                  R('div', { key:'b', style:{ fontSize:11, color:N500, marginTop:2 } }, h.date),
                  R('span', { key:'c', style:{ fontSize:10, fontWeight:700, padding:'2px 8px', borderRadius:999, marginTop:4, display:'inline-block', background:SUCCESS_SOFT, color:'#166534' } }, h.status),
                ]),
                R('span', { key:'amt', style:{ fontSize:13, fontWeight:700, color:N900 } }, rp(h.amount)),
              ])
            )),
          ]
        ),
      ]));
    }

    // ---------- HISTORY ----------
    if (s.screen === 'history') {
      const filters = ['Semua','Belanja','PPOB','Payroll Deduction'];
      const list = HISTORY.filter(h => s.historyFilter==='Semua' || h.type===s.historyFilter);
      return R(IOSDevice, { width:402, height:874 }, page([
        R('div', { key:'nav', style:{ display:'flex', alignItems:'center', gap:12, padding:'14px 16px' } }, [
          R('button', { key:'back', onClick:()=>this.go('wallet'), style:{ background:N50, border:'none', width:36, height:36, borderRadius:10, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center' } }, Icon('chevronLeft', { size:18, color:N700 })),
          R('div', { key:'t', style:{ fontSize:15, fontWeight:700, color:N900 } }, 'Riwayat Transaksi'),
        ]),
        R('div', { key:'filters', style:{ display:'flex', gap:8, padding:'0 16px 12px', overflowX:'auto' } }, filters.map(f =>
          R('button', { key:f, onClick:()=>this.setState({historyFilter:f}), style:{ flexShrink:0, padding:'7px 13px', borderRadius:999, border:`1px solid ${s.historyFilter===f?BLUE:N200}`, background:s.historyFilter===f?BLUE_SOFT:'#fff', color:s.historyFilter===f?BLUE:N700, fontSize:12, fontWeight:600, cursor:'pointer' } }, f)
        )),
        R('div', { key:'list', style:{ flex:1, padding:'0 16px', display:'flex', flexDirection:'column', gap:8, overflowY:'auto' } }, list.map(h =>
          R('div', { key:h.id, style:{ display:'flex', justifyContent:'space-between', alignItems:'center', background:'#fff', border:`1px solid ${N100}`, borderRadius:12, padding:12 } }, [
            R('div', { key:'l' }, [
              R('div', { key:'a', style:{ fontSize:13, fontWeight:600, color:N900 } }, h.title),
              R('div', { key:'b', style:{ fontSize:11, color:N500, marginTop:2 } }, h.date),
              R('span', { key:'c', style:{ fontSize:10, fontWeight:700, padding:'2px 8px', borderRadius:999, marginTop:4, display:'inline-block', background: h.status==='Gagal'?ERROR_SOFT:SUCCESS_SOFT, color: h.status==='Gagal'?ERROR:'#166534' } }, h.status),
            ]),
            R('span', { key:'amt', style:{ fontSize:13, fontWeight:700, color: h.amount>0?SUCCESS:N900 } }, (h.amount>0?'+':'') + rp(h.amount)),
          ])
        )),
      ]));
    }

    // ---------- PROFILE & NOTIFICATION ----------
    if (s.screen === 'profile') {
      return R(IOSDevice, { width:402, height:874 }, this.wrapTabs(s, R('div', { style:{ padding:'16px 16px 24px', display:'flex', flexDirection:'column', gap:16 } }, [
        R('div', { key:'head', style:{ display:'flex', alignItems:'center', gap:12 } }, [
          R('div', { key:'av', style:{ width:56, height:56, borderRadius:'50%', background:BLUE_SOFT, color:BLUE, display:'flex', alignItems:'center', justifyContent:'center', fontWeight:700, fontSize:18 } }, 'BS'),
          R('div', { key:'i' }, [
            R('div', { key:'n', style:{ fontSize:16, fontWeight:700, color:N900 } }, 'Budi Santoso'),
            R('div', { key:'d', style:{ fontSize:12, color:N500 } }, 'EMP-12345 · Produksi, Line 3'),
          ]),
        ]),
        R('div', { key:'tabs', style:{ display:'flex', gap:6, background:N100, borderRadius:12, padding:4 } }, ['profile','notif'].map(t =>
          R('button', { key:t, onClick:()=>this.setState({profileTab:t}), style:{ flex:1, padding:'8px', borderRadius:9, border:'none', background:s.profileTab===t?'#fff':'transparent', fontWeight:700, fontSize:12.5, color:s.profileTab===t?BLUE:N500, cursor:'pointer' } }, t==='profile'?'Profil':'Notifikasi')
        )),
        s.profileTab === 'profile'
          ? R('div', { key:'menu', style:{ background:'#fff', border:`1px solid ${N100}`, borderRadius:14, overflow:'hidden' } }, ['Simpanan & Pinjaman','Data Diri','Payroll Deduction','Metode Pembayaran','Keamanan','Bahasa','Bantuan'].map((m,i,arr) =>
              R('div', { key:m, onClick: m==='Simpanan & Pinjaman' ? ()=>this.go('simpanpinjam') : undefined, style:{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'14px 14px', borderBottom: i<arr.length-1?`1px solid ${N50}`:'none', cursor:'pointer' } }, [
                R('span', { key:'l', style:{ fontSize:13.5, color:N900, fontWeight:500 } }, m),
                Icon('chevronRight', { size:16, color:N300 }),
              ])
            ))
          : R('div', { key:'notifs', style:{ display:'flex', flexDirection:'column', gap:8 } }, NOTIFICATIONS.map((n,i) =>
              R('div', { key:i, style:{ display:'flex', gap:10, background:'#fff', border:`1px solid ${N100}`, borderRadius:12, padding:12 } }, [
                Icon('bell', { size:15, color:n.color }),
                R('div', { key:'body' }, [
                  R('div', { key:'t', style:{ fontSize:13, fontWeight:700, color:N900 } }, n.title),
                  R('div', { key:'b', style:{ fontSize:12, color:N500, marginTop:2 } }, n.body),
                  R('div', { key:'time', style:{ fontSize:10.5, color:N300, marginTop:4 } }, n.time),
                ]),
              ])
            )),
        s.profileTab === 'profile' && R('button', { key:'logout', onClick:()=>this.setState({screen:'login', empId:'', password:''}), style:{ padding:'14px', borderRadius:12, border:`1px solid ${ERROR}`, background:'#fff', color:ERROR, fontWeight:700, fontSize:13.5, cursor:'pointer' } }, 'Keluar'),
      ])));
    }

    return R(IOSDevice, { width:402, height:874 }, page([R('div',{key:'x'},'—')]));
  }

  wrapTabs(s, content) {
    const R = React.createElement;
    const tabs = [
      { id:'home', label:'Beranda', icon:'home' }, { id:'shop', label:'Belanja', icon:'bag' },
      { id:'ppob', label:'PPOB', icon:'ppob' }, { id:'wallet', label:'Wallet', icon:'wallet' }, { id:'profile', label:'Akun', icon:'user' },
    ];
    return R('div', { style:{ minHeight:'100%', display:'flex', flexDirection:'column', background:N25 } }, [
      R('div', { key:'content', style:{ flex:1, overflowY:'auto', paddingTop:56 } }, content),
      R('div', { key:'nav', style:{ display:'flex', borderTop:`1px solid ${N100}`, background:'#fff', padding:'8px 4px 4px' } }, tabs.map(t => {
        const active = s.screen === t.id;
        return R('button', { key:t.id, onClick:()=>this.setState({screen:t.id, tab:t.id}), style:{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', gap:4, background:'none', border:'none', cursor:'pointer', padding:'4px 0' } }, [
          R('div', { key:'ic' }, Icon(t.icon, { size:21, color: active?BLUE:N500 })),
          R('span', { key:'l', style:{ fontSize:10, fontWeight:700, color: active?BLUE:N500 } }, t.label),
        ]);
      })),
    ]);
  }
}
</script>
</body>
</html>
