<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  body{margin:0;display:flex;align-items:center;justify-content:center;height:100vh;background:transparent;font-family:Arial,sans-serif}
  #mark{width:320px;height:320px;border-radius:72px;background:#fff;display:flex;align-items:center;justify-content:center;position:relative}
  #mark .diamond{width:130px;height:130px;background:#E20A17;transform:rotate(45deg);border-radius:20px 50px 20px 50px}
  #mark .dot{position:absolute;width:30px;height:30px;background:#fff;border-radius:50%}
</style></head>
<body>
  <div id="mark"><div class="diamond"></div><div class="dot"></div></div>
</body></html>
